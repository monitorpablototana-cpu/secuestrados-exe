<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0e18">
  <meta name="description" content="Escape room educativo de ciberseguridad SECUESTRADOS.EXE">
  <title>SECUESTRADOS.EXE</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="signal" aria-hidden="true"></span><span>SECUESTRADOS<span class="accent">.EXE</span></span></div>
      <div class="topright"><span id="timer" class="timer" aria-live="off">--:--</span><button id="reset" class="link-button" type="button" hidden>↻ Reiniciar</button></div>
    </header>
    <main id="app" aria-live="polite"></main>
    <footer class="footer">SIMULACIÓN EDUCATIVA · No se instala software ni se accede a datos del dispositivo</footer>
  </div>
</body>
</html>
